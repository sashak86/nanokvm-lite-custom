<link data-kvm-ui="brand" rel="icon" type="image/svg+xml" href="/branding/favicon.svg"><link data-kvm-ui="brand" rel="alternate icon" href="/branding/favicon.ico"><link data-kvm-ui="brand" rel="apple-touch-icon" href="/branding/apple-touch-icon.png">
<script data-kvm-ui="custom-default">(function(){function brand(){if(document.title!=="NanoKVM Lite · Sasha")document.title="NanoKVM Lite · Sasha";document.querySelectorAll('link[rel~=icon]:not([data-kvm-ui]),link[rel=apple-touch-icon]:not([data-kvm-ui])').forEach(function(e){e.remove()})}brand();new MutationObserver(brand).observe(document.head,{childList:true,subtree:true,characterData:true});function ui(){try{return sessionStorage.getItem('kvm-ui')}catch(e){}}function chk(){fetch('/api/vm/hdmi',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(r.status==200){try{sessionStorage.removeItem('kvm-ui')}catch(e){}location.replace('/m.html')}else setTimeout(chk,1500)}).catch(function(){setTimeout(chk,3000)})}var q=new URLSearchParams(location.search);if(q.get('classic')=='1')return;if(q.get('login')=='1'||ui()=='login')chk();else if(location.pathname=='/'||location.pathname=='/index.html')location.replace('/m.html')})();</script>
